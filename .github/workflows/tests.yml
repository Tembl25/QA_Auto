
name: UI Autotests and Allure Report

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      - name: Grant execute permission to Gradle
        run: chmod +x gradlew

      - name: Run tests
        id: tests
        continue-on-error: true
        run: ./gradlew clean test -Dselenide.headless=true

      - name: Generate Allure report
        if: always()
        run: ./gradlew allureReport

      - name: Configure GitHub Pages
        if: always() && steps.tests.outcome != 'cancelled'
        uses: actions/configure-pages@v5

      - name: Upload Allure report
        if: always() && steps.tests.outcome != 'cancelled'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/reports/allure-report/allureReport

      - name: Deploy to GitHub Pages
        id: deployment
        if: always() && steps.tests.outcome != 'cancelled'
        uses: actions/deploy-pages@v4

      - name: Mark workflow failed if tests failed
        if: always() && steps.tests.outcome == 'failure'
        run: exit 1
